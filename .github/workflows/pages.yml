# Build, test and deploy the game to GitHub Pages (ADR-0002).
#
# Every push to main runs the tests and the production build — a red X on a
# commit means the gate failed in CI too.
#
# DEPLOY runs only while the repo is named `letters-at-home` (ADR-0003
# QST-REPO-NAME; previously `five-bytes`, ADR-0002). The check keeps the site
# from being published under a stale name. IF THE REPO IS EVER RENAMED AGAIN,
# update this name too, or deploys are silently skipped (the build job stays green).
#
# One-time repo setting: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Project sites live under /<repo-name>/ — read from the repo itself,
          # so a rename needs no edit here or in vite.config.ts.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.event.repository.name == 'letters-at-home'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
